<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de sécurité</title>
    <!-- Tailwind CSS pour un style moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-subtle 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

    <!-- Arrière-plan décoratif avec dégradés flous -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow" style="animation-delay: 2s;"></div>

    <!-- Carte principale -->
    <main class="relative z-10 w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-8 text-center transition-all">
        
        <!-- Icône de sécurité -->
        <div class="mx-auto mb-6 w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl flex items-center justify-center text-emerald-400 shadow-inner">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
        </div>

        <!-- Titre et sous-titre -->
        <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Vérification de sécurité</h1>
        <p class="text-slate-400 text-sm mb-6 leading-relaxed">
            Veuillez cocher la case ci-dessous pour confirmer que vous n'êtes pas un robot et accéder au site.
        </p>

        <!-- Formulaire de vérification hCaptcha -->
        <form action="accueil.html" method="POST" id="captchaForm" class="flex flex-col items-center">
            
            <!-- Intégration du Widget hCaptcha -->
            <div class="my-2 p-1 bg-slate-950/50 rounded-xl border border-slate-800/80">
                <div class="h-captcha" 
                     data-sitekey="58121974-557a-4d76-a3a4-a53e799e7dda"
                     data-callback="onCaptchaSuccess">
                </div>
            </div>

            <!-- Message d'erreur personnalisé -->
            <div id="errorMessage" class="hidden mt-3 text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg py-2 px-3 w-full">
                Veuillez valider le test de sécurité ci-dessus.
            </div>

            <!-- Bouton de validation -->
            <button type="submit" 
                    id="submitBtn"
                    class="mt-6 w-full py-3.5 px-6 rounded-xl font-medium text-slate-300 bg-slate-800 border border-slate-700 hover:bg-slate-700 hover:text-white transition-all duration-200 cursor-pointer flex items-center justify-center gap-2">
                <span>Continuer vers le site</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>
        </form>

        <!-- Footer / Protection -->
        <div class="mt-8 pt-6 border-t border-slate-800/60 flex items-center justify-center gap-2 text-xs text-slate-500">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
            </svg>
            <span>Connexion sécurisée SSL</span>
        </div>
    </main>

    <!-- Script de gestion de la redirection -->
    <script>
        const form = document.getElementById('captchaForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        // Fonction appelée automatiquement par hCaptcha quand le test est réussi
        function onCaptchaSuccess(token) {
            errorMessage.classList.add('hidden');
            
            // Met en valeur le bouton de validation
            submitBtn.className = "mt-6 w-full py-3.5 px-6 rounded-xl font-medium text-white bg-emerald-600 hover:bg-emerald-500 shadow-lg shadow-emerald-600/25 transition-all duration-200 cursor-pointer flex items-center justify-center gap-2";
            
            // Optionnel : redirige immédiatement après 500ms sans cliquer
            setTimeout(() => {
                window.location.href = "accueil.html";
            }, 500);
        }

        // Vérification si l'utilisateur clique sur le bouton sans avoir fait le captcha
        form.addEventListener('submit', function(e) {
            const hcaptchaResponse = hcaptcha.getResponse();
            if (!hcaptchaResponse) {
                e.preventDefault(); // Empêche la redirection
                errorMessage.classList.remove('hidden');
            }
        });
    </script>

</body>
</html>
