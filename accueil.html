<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Launcher - Accueil</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-subtle 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6 relative overflow-x-hidden font-sans">

    <!-- Arrière-plan décoratif -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow" style="animation-delay: 3s;"></div>

    <!-- En-tête / Barre supérieure -->
    <header class="relative z-10 w-full max-w-6xl mx-auto flex items-center justify-between py-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-center text-emerald-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <span class="font-bold text-lg tracking-wide text-white">Launcher Hub</span>
        </div>
        
        <div class="flex items-center gap-4 text-sm text-slate-400">
            <span class="flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-full backdrop-blur-md">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Accès vérifié
            </span>
            <a href="index.html" title="Déconnexion / Revérifier" class="p-2 hover:bg-slate-800 rounded-xl transition text-slate-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </a>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="relative z-10 w-full max-w-4xl mx-auto my-auto flex flex-col items-center text-center">
        
        <!-- Horloge Digitale -->
        <div class="mb-6">
            <h1 id="clock" class="text-6xl sm:text-7xl font-extrabold text-white tracking-tight">00:00</h1>
            <p id="date" class="text-slate-400 text-sm sm:text-base mt-2 font-medium capitalize"></p>
        </div>

        <!-- Barre de recherche -->
        <form action="https://www.google.com/search" method="GET" class="w-full max-w-xl mb-12">
            <div class="relative flex items-center">
                <input type="text" name="q" placeholder="Rechercher sur le web..." 
                       class="w-full py-4 pl-12 pr-12 bg-slate-900/90 border border-slate-800 focus:border-indigo-500 rounded-2xl text-white placeholder-slate-500 shadow-xl backdrop-blur-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                <svg class="w-5 h-5 text-slate-500 absolute left-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <button type="submit" class="absolute right-3 p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </div>
        </form>

        <!-- Grille de liens / Raccourcis -->
        <div class="w-full">
            <div class="flex items-center justify-between mb-4 px-2">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Mes Raccourcis</h2>
                <button onclick="openModal()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Ajouter un lien
                </button>
            </div>

            <!-- Grille dynamique -->
            <div id="linksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Raccourci Fixe/Permanent Horloge -->
                <div class="group relative bg-slate-900/60 border border-indigo-500/30 hover:border-indigo-500 rounded-2xl p-4 flex flex-col items-center justify-center gap-3 transition-all duration-200 hover:-translate-y-1 hover:shadow-xl backdrop-blur-md">
                    <a href="horloge.html" class="flex flex-col items-center gap-3 w-full h-full">
                        <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center p-2.5 text-indigo-400 group-hover:scale-110 transition-transform">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <span class="text-sm font-medium text-slate-200 group-hover:text-white truncate max-w-full">Horloge</span>
                    </a>
                    <span class="absolute top-2 right-2 px-1.5 py-0.5 text-[10px] font-semibold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 rounded">
                        Système
                    </span>
                </div>

                <!-- Les cartes de liens utilisateur seront insérées ici par JS -->
            </div>
        </div>

    </main>

    <!-- Pied de page -->
    <footer class="relative z-10 w-full max-w-6xl mx-auto text-center py-4 text-xs text-slate-600">
        Launcher personnel &copy; 2026 — Tous droits réservés.
    </footer>

    <!-- Modal d'ajout de lien -->
    <div id="addModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <h3 class="text-lg font-bold text-white mb-4">Ajouter un nouveau raccourci</h3>
            
            <form id="addLinkForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 text-left">Nom du site</label>
                    <input type="text" id="linkTitle" placeholder="Ex: YouTube" required 
                           class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 text-left">URL du site</label>
                    <input type="url" id="linkUrl" placeholder="https://youtube.com" required 
                           class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex items-center justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white transition">
                        Annuler
                    </button>
                    <button type="submit" class="px-5 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition font-medium">
                        Ajouter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        // --- 1. Gestion de l'horloge ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. Liens personnalisables ---
        const defaultLinks = [
            { id: 1, title: 'Google', url: 'https://google.com' },
            { id: 2, title: 'YouTube', url: 'https://youtube.com' },
            { id: 3, title: 'GitHub', url: 'https://github.com' }
        ];

        function getLinks() {
            const stored = localStorage.getItem('launcher_links');
            return stored ? JSON.parse(stored) : defaultLinks;
        }

        function saveLinks(links) {
            localStorage.setItem('launcher_links', JSON.stringify(links));
            renderLinks();
        }

        // --- 3. Affichage des cartes de liens ---
        function renderLinks() {
            const links = getLinks();
            const grid = document.getElementById('linksGrid');
            
            // Conserve la carte permanente vers horloge.html (le premier enfant HTML)
            const permanentCard = grid.firstElementChild;
            grid.innerHTML = '';
            grid.appendChild(permanentCard);

            links.forEach(link => {
                let faviconUrl = '';
                try {
                    const domain = new URL(link.url).hostname;
                    faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                } catch(e) {
                    faviconUrl = 'https://via.placeholder.com/32';
                }

                const card = document.createElement('div');
                card.className = "group relative bg-slate-900/60 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center gap-3 transition-all duration-200 hover:-translate-y-1 hover:shadow-xl backdrop-blur-md";

                card.innerHTML = `
                    <a href="${link.url}" target="_blank" class="flex flex-col items-center gap-3 w-full h-full">
                        <div class="w-12 h-12 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center justify-center p-2.5 group-hover:scale-110 transition-transform">
                            <img src="${faviconUrl}" alt="${link.title}" class="w-full h-full object-contain" onError="this.src='https://via.placeholder.com/32'">
                        </div>
                        <span class="text-sm font-medium text-slate-200 group-hover:text-white truncate max-w-full">${link.title}</span>
                    </a>
                    <button onclick="deleteLink(${link.id})" title="Supprimer" 
                            class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 p-1 text-slate-500 hover:text-rose-400 transition-opacity">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // --- 4. Ajouter / Supprimer un lien ---
        function deleteLink(id) {
            const links = getLinks().filter(l => l.id !== id);
            saveLinks(links);
        }

        document.getElementById('addLinkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('linkTitle').value.trim();
            let url = document.getElementById('linkUrl').value.trim();

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const links = getLinks();
            links.push({ id: Date.now(), title, url });
            saveLinks(links);

            document.getElementById('addLinkForm').reset();
            closeModal();
        });

        // --- 5. Fonctions Modal ---
        function openModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        // Initialisation
        renderLinks();
    </script>
</body>
</html>
